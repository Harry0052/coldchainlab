name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  VSTEST_ARTIFACTS_DIRECTORY: ${{ runner.temp }}/vstest

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.404

      - name: Restore
        run: dotnet restore ColdChainLab.slnx --locked-mode

      - name: Format
        run: dotnet format ColdChainLab.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test ColdChainLab.slnx --configuration Release --no-restore

      - name: Demo
        run: |
          set -euo pipefail
          mkdir -p artifacts/demo artifacts/demo-dropout
          dotnet run --project src/ColdChainLab.Cli --configuration Release --no-restore -- demo --out artifacts/demo | tee artifacts/demo/stdout.txt
          grep -F "detection-delay-min 3 fault power-loss-1" artifacts/demo/stdout.txt
          dotnet run --project src/ColdChainLab.Cli --configuration Release --no-restore -- demo dropout --out artifacts/demo-dropout | tee artifacts/demo-dropout/stdout.txt
          grep -F "missed-excursions 1" artifacts/demo-dropout/stdout.txt
          grep -F "gap-alerts 1" artifacts/demo-dropout/stdout.txt

      - name: Upload demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo
          path: |
            artifacts/demo
            artifacts/demo-dropout
          if-no-files-found: error
